<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0B10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="민경호 (Min Kyungho) — 서강대 전자공학·컴퓨터공학 학부생. 의료 RF 신호 복원, embodied LLM agents, LLM 기반 연구 자동화를 연구 아이디어에서 동작하는 시스템으로 구현합니다."
    />
    <meta name="author" content="Min Kyungho" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Min Kyungho — Research, reconstructed." />
    <meta
      property="og:description"
      content="Research-oriented AI engineer. RF signal reconstruction · Embodied AI · LLM agent systems."
    />
    <meta property="og:locale" content="ko_KR" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Min Kyungho — Research, reconstructed.</title>

    <!-- Set theme before paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
